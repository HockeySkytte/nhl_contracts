name: Daily NHL Contracts, Trades & Injuries Update

on:
  schedule:
    # Runs daily at 11:00 UTC (06:00 ET / 12:00 CET)
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Force Supabase upsert even if no data changed"
        required: false
        default: false
        type: boolean
      season_year:
        description: "Season start year (e.g. 2026 for 2026-27)"
        required: false
        default: "2026"
        type: string

permissions:
  contents: write

concurrency:
  group: daily-nhl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check live feeds & sync changes to Supabase
        id: sync
        env:
          DATABASE_HS_URL: ${{ secrets.DATABASE_HS_URL }}
        run: |
          SEASON="${{ inputs.season_year || '2026' }}"
          FORCE_FLAG=""
          if [ "${{ inputs.force_sync }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -u scripts/daily_update.py --season "$SEASON" $FORCE_FLAG

      - name: Commit updated data snapshots to repository
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ cache/nhlpa/compensation_history.json cache/nhl/player_bios_2010_2026.json
          if ! git diff --cached --quiet; then
            DATE_UTC="$(date -u +%Y-%m-%d)"
            FEEDS="${{ steps.sync.outputs.changed_feeds }}"
            git commit -m "Daily update (${DATE_UTC}): ${FEEDS}"
            git push
          fi
